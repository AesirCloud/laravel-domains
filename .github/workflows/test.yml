name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4', '8.6']

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install composer dependencies
        run: composer update --no-progress --no-interaction --prefer-dist --with-all-dependencies

      - name: Run tests (Pest)
        run: |
          ./vendor/bin/pest
